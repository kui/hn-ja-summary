"$schema" = "./node_modules/wrangler/config-schema.json"
name = "hn-feed-backend"
main = "index.ts"
compatibility_date = "2026-05-18"
workers_dev = false

[triggers]
crons = ["22,52 * * * *"]

[secrets]
required = ["GEMINI_API_KEY", "FIRECRAWL_API_KEY"]

[[d1_databases]]
binding = "DB"
database_name = "hn-feed"
database_id = "e3e14322-b111-49a2-b734-6316fc3c6809"
migrations_dir = "../migrations"

[[queues.producers]]
binding = "QUEUE"
queue = "hn-processor"

# Gemini は Flex 推論で呼ぶため 1 件あたり最大十数分かかる。consumer の wall time 上限は
# 1 回の実行あたり 15 分なので、1 回 1 件にして上限に収め、件数は並列実行（max_concurrency 未指定で自動スケール）でこなす。
# Flex の容量不足（503/429）などの一時的なエラー、打ち切り（504）、タイムアウト、接続切れ、出力の形式不正や上限での途切れは
# processor が 1 分から倍々の遅延で再試行する。6 回で計約 1 時間待つ。
# retry_delay は wall time 超過などで実行自体が失敗したときの再配信間隔。
[[queues.consumers]]
queue = "hn-processor"
max_batch_size = 1
max_retries = 6
retry_delay = 300

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
