name: Deploy

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

# 走行中のデプロイを止めると Worker の版が混ざるので、後続は待たせて最新の push だけを流す
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    # 手動実行で production 以外のブランチを選んでも、本番にデプロイさせない
    if: github.ref == 'refs/heads/production'
    uses: ./.github/workflows/ci.yml

  # 新しいコードが追加カラムを参照する前に、スキーマを先に進める
  migrate:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: npm run db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy:
    needs: migrate
    strategy:
      # 1 つの Worker のデプロイ失敗で、ほかの Worker のデプロイを止めない
      fail-fast: false
      matrix:
        workspace: [feed, backend, admin]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: npm -w ${{ matrix.workspace }} run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
