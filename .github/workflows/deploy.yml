name: Deploy

on:
  push:
    branches: [production]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-poller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: docker/setup-buildx-action@v4
      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: poller/Dockerfile
          push: true
          tags: gcr.io/${{ secrets.GCP_PROJECT_ID }}/hn-feed-poller:latest
      - name: Deploy Cloud Run Job
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'asia-northeast1' }}
          QUEUE: ${{ vars.CLOUD_TASKS_QUEUE || 'hn-processor' }}
          PROCESSOR_URL: ${{ secrets.PROCESSOR_URL }}
        run: |
          SA_EMAIL="hn-feed-sa@${PROJECT_ID}.iam.gserviceaccount.com"
          gcloud run jobs deploy hn-feed-poller \
            --image="gcr.io/${PROJECT_ID}/hn-feed-poller:latest" \
            --region="${REGION}" \
            --set-env-vars="GCP_PROJECT_ID=${PROJECT_ID},GCP_REGION=${REGION},CLOUD_TASKS_QUEUE=${QUEUE},PROCESSOR_URL=${PROCESSOR_URL},SERVICE_ACCOUNT_EMAIL=${SA_EMAIL}" \
            --project="${PROJECT_ID}"

  deploy-processor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: docker/setup-buildx-action@v4
      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: processor/Dockerfile
          push: true
          tags: gcr.io/${{ secrets.GCP_PROJECT_ID }}/hn-feed-processor:latest
      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: hn-feed-processor
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/hn-feed-processor:latest
          region: ${{ vars.GCP_REGION || 'asia-northeast1' }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          env_vars: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            CLOUDFLARE_KV_NAMESPACE_ID=${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
            CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
            WORKERS_DOMAIN=${{ vars.WORKERS_DOMAIN }}
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            MAX_COMMENTS=${{ vars.MAX_COMMENTS || '20' }}
