name: CI

on:
  pull_request:
  # production への push では Deploy ワークフローがここを呼ぶので、push トリガーは置かない
  workflow_call:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: npm run fmt:check
      - run: npm run ts:check
      - run: npm run lint:check
      - run: npm test
      # マイグレーションの SQL が本番 DB で初めて実行されないよう、先にローカルの D1 で流す
      - run: npm run db:migrate:local
